<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Official Portfolio & Shop</title>
  <style>
    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --primary: #2563eb;
      --text: #1f2937;
      --text-muted: #6b7280;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); padding: 20px; max-width: 480px; margin: 0 auto; }
    
    /* 언어 스위처 */
    .lang-switcher { text-align: right; margin-bottom: 10px; }
    .lang-btn { background: none; border: none; font-weight: bold; cursor: pointer; color: var(--text-muted); padding: 2px 6px; }
    .lang-btn.active { color: var(--primary); text-decoration: underline; }

    /* 프로필 섹션 */
    .profile { text-align: center; margin-bottom: 24px; }
    .profile-img { width: 90px; height: 90px; border-radius: 50%; background: #ddd; margin: 0 auto 12px; }
    .profile h1 { font-size: 1.25rem; font-weight: 700; }
    .profile p { font-size: 0.9rem; color: var(--text-muted); margin-top: 4px; }

    /* 카드형 섹션 */
    .card { background: var(--card-bg); border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
    .card h2 { font-size: 1.05rem; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
    
    /* 버튼 */
    .btn { display: block; width: 100%; padding: 12px; text-align: center; background: var(--primary); color: white; border-radius: 10px; text-decoration: none; font-weight: 600; border: none; cursor: pointer; margin-top: 8px; }
    .btn-secondary { background: #e5e7eb; color: #374151; }

    /* 입력 폼 */
    .input-field { width: 100%; padding: 10px; margin-top: 6px; margin-bottom: 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 0.9rem; }
  </style>
</head>
<body>

  <!-- 언어 선택 -->
  <div class="lang-switcher">
    <button class="lang-btn active" onclick="setLanguage('ko')">KO</button> | 
    <button class="lang-btn" onclick="setLanguage('en')">EN</button>
  </div>

  <!-- 메인 프로필 -->
  <div class="profile">
    <div class="profile-img"></div>
    <h1 id="prof-title">공식 글로벌 브랜드 홈</h1>
    <p id="prof-desc">커미션 문의 · 글로벌 제품 구매 · 멤버십 가입</p>
  </div>

  <!-- 1. 커미션 섹션 -->
  <div class="card">
    <h2 id="comm-title">🎨 커미션 신청 (Commission)</h2>
    <p id="comm-desc" style="font-size:0.85rem; color:var(--text-muted); margin-bottom:12px;">
      1:1 맞춤 작업 및 외주 문의를 받고 있습니다.
    </p>
    <a href="https://forms.gle/your-google-form-id" target="_blank" class="btn" id="comm-btn">커미션 안내 및 신청하기</a>
  </div>

  <!-- 2. 제품 구매 섹션 -->
  <div class="card">
    <h2 id="prod-title">🛍️ 대표 제품 (Products)</h2>
    <p id="prod-desc" style="font-size:0.85rem; color:var(--text-muted); margin-bottom:12px;">
      국내외 무료/직배송 지원 가능한 제품 목록입니다.
    </p>
    <a href="https://your-global-shop-link.com" target="_blank" class="btn btn-secondary" id="prod-btn-1">글로벌 쇼핑몰 이동 (Global Store)</a>
  </div>

  <!-- 3. 회원가입/멤버십 유도 섹션 -->
  <div class="card">
    <h2 id="signup-title">🎁 VIP 멤버십 가입</h2>
    <p id="signup-desc" style="font-size:0.85rem; color:var(--text-muted); margin-bottom:8px;">
      이메일을 남겨주시면 신제품 할인 쿠폰 및 소식을 가장 먼저 받아보실 수 있습니다.
    </p>
    <form id="subscribe-form" onsubmit="handleSignup(event)">
      <input type="email" class="input-field" placeholder="example@email.com" required id="email-input" />
      <button type="submit" class="btn" id="signup-btn">혜택받고 회원가입</button>
    </form>
  </div>

  <!-- 다국어 텍스트 스크립트 -->
  <script>
    const i18n = {
      ko: {
        profTitle: "공식 브랜드 홈",
        profDesc: "커미션 문의 · 글로벌 제품 구매 · 멤버십 가입",
        commTitle: "🎨 커미션 신청",
        commDesc: "1:1 맞춤 작업 및 제작 문의를 받고 있습니다.",
        commBtn: "커미션 안내 및 신청하기",
        prodTitle: "🛍️ 대표 제품",
        prodDesc: "국내외 배송이 가능한 인기 제품 모음입니다.",
        prodBtn1: "공식 제품몰 둘러보기",
        signupTitle: "🎁 멤버십 가입 (혜택 수령)",
        signupDesc: "이메일을 등록하고 할인 쿠폰 및 소식을 받으세요.",
        signupBtn: "혜택받고 가입하기",
        emailPlaceholder: "이메일 주소를 입력하세요"
      },
      en: {
        profTitle: "Official Global Home",
        profDesc: "Commission · Global Shop · Membership",
        commTitle: "🎨 Request Commission",
        commDesc: "Accepting 1:1 custom requests and projects.",
        commBtn: "View Details & Request",
        prodTitle: "🛍️ Official Shop",
        prodDesc: "Check out our featured products with worldwide shipping.",
        prodBtn1: "Visit Shop",
        signupTitle: "🎁 Join VIP Membership",
        signupDesc: "Subscribe with your email to get exclusive discount coupons.",
        signupBtn: "Subscribe",
        emailPlaceholder: "Enter your email"
      }
    };

    function setLanguage(lang) {
      document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      const t = i18n[lang];
      document.getElementById('prof-title').innerText = t.profTitle;
      document.getElementById('prof-desc').innerText = t.profDesc;
      document.getElementById('comm-title').innerText = t.commTitle;
      document.getElementById('comm-desc').innerText = t.commDesc;
      document.getElementById('comm-btn').innerText = t.commBtn;
      document.getElementById('prod-title').innerText = t.prodTitle;
      document.getElementById('prod-desc').innerText = t.prodDesc;
      document.getElementById('prod-btn-1').innerText = t.prodBtn1;
      document.getElementById('signup-title').innerText = t.signupTitle;
      document.getElementById('signup-desc').innerText = t.signupDesc;
      document.getElementById('signup-btn').innerText = t.signupBtn;
      document.getElementById('email-input').placeholder = t.emailPlaceholder;
    }

    function handleSignup(e) {
      e.preventDefault();
      const email = document.getElementById('email-input').value;
      alert("감사합니다! 가입이 완료되었습니다: " + email);
      document.getElementById('email-input').value = "";
    }
  </script>
</body>
</html>
